modLoader = "javafml"
loaderVersion = "[1,)"
license="MIT"

[[mods]]
modId="spatial_gui"
version="${version}"
displayName="Spatial GUI"
displayURL="https://github.com/tastytrash/Spatial-GUI"
issueTrackerURL="https://github.com/tastytrash/Spatial-GUI/issues"
logoFile="assets/spatial-gui/icon.png"
iconFile = "/assets/spatial-gui/icon.png"
bannerFile = "/assets/spatial-gui/icon.png"
description='''
A client-side mod that renders inventory & container screens as a 3D plane.

§e[!] §cSpatial GUI is still in early development and may not be fully compatible with some of your mods. If something doesn't work correctly please report the issue to help make the mod better for everyone!
'''

[[mixins]]
config="spatial-gui.mixins.json"

[[dependencies.spatial_gui]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.spatial_gui]]
modId="minecraft"
type="required"
versionRange="${minecraft_dependency}"
ordering="NONE"
side="CLIENT"

[[dependencies.spatial_gui]]
modId="yet_another_config_lib_v3"
type="required"
versionRange="[3.0.0,)"
ordering="NONE"
side="CLIENT"